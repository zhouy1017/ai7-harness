name: E2E Nightly Merge Queue

# ADR 0081: the nightly is a serial merge queue over the open pull requests, then the daily record
# over the final `dev`. This orchestrator owns the schedule; `e2e-nightly.yml` keeps
# `workflow_dispatch` and gains `workflow_call`, so `dev` is not run twice a night.

on:
  schedule:
    # 19:00 UTC daily — 03:00 the next day in the Owner's UTC+8 working day, so a red nightly is
    # waiting at the start of it rather than arriving mid-session.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly-queue
  cancel-in-progress: false

jobs:
  list:
    name: List open slice and integration pull requests
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      count: ${{ steps.list.outputs.count }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/dev
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          architecture: x64
          check-latest: false

      - name: Read the candidate set
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/nightly-queue.mjs list --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"

  candidates:
    name: Candidate #${{ matrix.number }}
    needs: list
    if: ${{ github.ref == 'refs/heads/dev' && needs.list.outputs.count != '0' }}
    # A called workflow can only restrict the caller's token, never widen it: `contents: read` here
    # would stop `prepare` pushing the candidate ref and `merge` commenting, and a permission the
    # called workflow asks for and this call site withholds refuses the whole run before any job
    # exists. Every scope `e2e-candidate.yml` names is therefore granted here — `issues: write` for
    # the Issues a merged candidate closes. The candidate jobs that only test narrow themselves to
    # `contents: read` inside `e2e-candidate.yml`.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    strategy:
      fail-fast: false
      # Candidates are independent runs: one failing never stops the queue, and a merge changes
      # the tip the next candidate is prepared against only through the serial order below.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    uses: ./.github/workflows/e2e-candidate.yml
    with:
      pr: ${{ matrix.number }}
      merge: ${{ matrix.merge }}
    secrets: inherit

  resolve:
    name: Resolve final dev once
    permissions:
      contents: read
    needs: candidates
    if: ${{ always() && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      eligible: ${{ steps.source.outputs.eligible }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          check-latest: false
      - name: Pin the final integrated source
        id: source
        run: node tools/release.mjs resolve

  dev:
    name: Full Gate over the final dev
    needs: resolve
    if: ${{ always() && needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-nightly.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    name: Package final dev (${{ matrix.platform }})
    needs: [resolve, dev]
    # Candidate failures may make the outer run red; only the complete final-dev Gate admits packages.
    # ADR 0097 (2026-10-24): Windows x64 only; the macOS inspection package is deferred with the
    # macOS platform and returns only through a new Owner decision.
    if: ${{ always() && needs.resolve.result == 'success' && needs.dev.result == 'success' && needs.resolve.outputs.eligible == 'true' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: windows-2025
            architecture: x64
            windows_marker: '1'
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_GATE_RUN: ${{ github.run_id }}
      AI7_CI_WINDOWS_SERVER_2025: ${{ matrix.windows_marker }}
      NPM_CONFIG_PREFIX: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          architecture: ${{ matrix.architecture }}
          check-latest: false
      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
      - name: Check supported host and closed inputs
        run: pnpm run doctor
      - name: Restore exact declared dependencies
        run: pnpm run bootstrap
      - name: Package without launching and stage only named outputs
        id: stage
        shell: bash
        run: pnpm run release:prepare -- --sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --gate-run "$RELEASE_GATE_RUN"
      - name: Upload explicit inspection files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inspection-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ steps.stage.outputs.files }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
          overwrite: false
