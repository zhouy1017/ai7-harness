name: E2E Functional Gate
run-name: E2E Functional Gate · ${{ github.event.pull_request.head.sha }} · ${{ github.event.pull_request.base.sha }}

on:
  # Routing and status publication execute trusted control code. Candidate code runs only
  # in the read-only Journey job; it cannot publish the required aggregate Gate status.
  pull_request_target:
    branches-ignore:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: read
  actions: read

# One Journey occurrence per pull request. A retarget (`edited` with a base change) is a new
# candidate; a title/body edit must neither rerun nor cancel the Journeys.
concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}-${{ (github.event.action == 'edited' && !github.event.changes.base && 'edit') || 'gate' }}
  cancel-in-progress: true

jobs:
  route:
    name: Route E2E
    # pull_request_target runs with this repository's cache scope, so a fork's code never runs
    # here; its result job reports that no trusted test run completed.
    if: >-
      ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-24.04
    outputs:
      run_gate: ${{ steps.route.outputs.run_gate }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/dev
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          check-latest: false

      - name: Route complete pull-request diff
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          changes_file="${RUNNER_TEMP:?}/ai7-e2e-route-paths-$$"
          trap 'rm -f "$changes_file"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changes_file"

          run_gate=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md) ;;
              *) run_gate=true; break ;;
            esac
          done < "$changes_file"

          printf 'run_gate=%s\n' "$run_gate" >> "$GITHUB_OUTPUT"

  gate:
    needs: route
    if: ${{ needs.route.outputs.run_gate == 'true' }}
    name: J-08 + J-12 + J-15 + J-03 + J-04 (Windows Server 2025 x64 CI)
    runs-on: windows-2025
    timeout-minutes: 15
    # The only job that executes candidate code: no status, pull-request or Actions scope.
    permissions:
      contents: read
    env:
      AI7_CI_WINDOWS_SERVER_2025: '1'
      NPM_CONFIG_PREFIX: ''
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          architecture: x64
          check-latest: false

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: Check supported host and closed inputs
        run: pnpm run doctor

      - name: Restore optional verified Electron download cache
        id: electron-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/bootstrap/electron
          key: ai7-electron-v1-${{ runner.os }}-x64-${{ hashFiles('config/dependency-artifacts.json') }}

      - name: Restore exact declared inputs
        run: pnpm run bootstrap

      - name: Save verified Electron download for this pull request
        if: ${{ steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/bootstrap/electron
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Build the production-shaped subject
        run: pnpm run build

      - name: Run the bounded pull-request Journey set
        run: pnpm run e2e:gate

  result:
    name: Publish E2E Functional Gate result
    needs: [route, gate]
    if: >-
      ${{ always() && github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    steps:
      - name: Check out trusted control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/dev
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          check-latest: false
      - name: Project the build and test result onto the exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_RESULT: ${{ needs.route.result == 'success' && needs.gate.result || 'failure' }}
        run: >-
          node tools/nightly-queue.mjs gate-status
          --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          --head "$HEAD_SHA" --expected-dev-tip "$BASE_SHA"
          --gate-result "$GATE_RESULT"
