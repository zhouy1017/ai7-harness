name: E2E Nightly Full Gate

on:
  schedule:
    # 19:00 UTC daily — 03:00 the next day in the Owner's UTC+8 working day, so a red nightly is
    # waiting at the start of it rather than arriving mid-session.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Exact ref to run the full admitted Journey set against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  full:
    name: J-01 + J-02 + J-08 + J-12 + J-15 + J-03 + J-04 (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows Server 2025 x64 CI
            runner: windows-2025
            architecture: x64
            windows_server_marker: '1'
          - label: macOS 15 arm64
            runner: macos-15
            architecture: arm64
            windows_server_marker: '0'
    env:
      AI7_CI_WINDOWS_SERVER_2025: ${{ matrix.windows_server_marker }}
      NPM_CONFIG_PREFIX: ''
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          architecture: ${{ matrix.architecture }}
          check-latest: false

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: Check supported host and closed inputs
        run: pnpm run doctor

      - name: Restore optional verified Electron download cache
        id: electron-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/bootstrap/electron
          key: ai7-electron-v1-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('config/dependency-artifacts.json') }}

      - name: Restore exact declared inputs
        run: pnpm run bootstrap

      - name: Save verified Electron download for this occurrence
        if: ${{ steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/bootstrap/electron
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Build the production-shaped subject
        run: pnpm run build

      - name: Run every admitted Journey
        run: pnpm run e2e:all
