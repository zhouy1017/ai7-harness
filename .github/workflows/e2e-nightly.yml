name: E2E Nightly Full Gate
run-name: E2E Nightly Full Gate · ${{ inputs.ref || github.sha }}${{ inputs.pr && format(' · PR {0} · {1}', inputs.pr, inputs.base) || '' }}

# The daily `schedule` moved to `e2e-nightly-queue.yml` under ADR 0081, which runs this full Gate
# over each open pull request and then calls this workflow once for the final `dev` tip. What this
# file runs is unchanged, so a dispatched occurrence against an exact ref is byte-for-byte the
# occurrence ADR 0075 §3 describes.
#
# ADR 0097 (2026-10-24): the matrix holds one Windows Server 2025 entry. The macOS entry is deferred
# indefinitely with the whole macOS platform; it is re-added only by a new Owner decision.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to run the admitted Journey set against
        required: true
        type: string
      pr:
        description: Optional same-repository non-main pull request whose existing required Gate status is published
        required: false
        default: ''
        type: string
      base:
        description: Exact current PR base SHA; required with pr (ref must be its exact head)
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        description: Full 40-character commit SHA to run the admitted Journey set against
        required: true
        type: string
      pr:
        required: false
        default: ''
        type: string
      base:
        required: false
        default: ''
        type: string

# Each job states its own token scopes. The candidate test job holds contents: read only;
# a reusable caller must grant the optional trusted publisher's declared scopes too.

concurrency:
  group: e2e-nightly-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact Full Gate pull request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The Owner explicitly dispatches a reviewed workflow revision. Privileged control never
      # executes the candidate checkout, even while dev still contains an older publisher.
      - name: Check out dispatched control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          check-latest: false
      - name: Bind the current same-repository head and base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.ref }}
          BASE_SHA: ${{ inputs.base }}
        run: >-
          node tools/nightly-queue.mjs full-gate-candidate
          --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          --head "$HEAD_SHA" --expected-dev-tip "$BASE_SHA"

  full:
    needs: resolve
    if: ${{ always() && !cancelled() && (inputs.pr == '' || needs.resolve.result == 'success') }}
    name: J-01 + J-02 + J-08 + J-12 + J-15 + J-03 + J-04 + J-05 + J-06 + J-07 + J-09 + J-10 + J-11 + J-16 + J-13 (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows Server 2025 x64 CI
            runner: windows-2025
            architecture: x64
            windows_server_marker: '1'
    env:
      AI7_CI_WINDOWS_SERVER_2025: ${{ matrix.windows_server_marker }}
      NPM_CONFIG_PREFIX: ''
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          architecture: ${{ matrix.architecture }}
          check-latest: false

      - name: Require the selected immutable checkout
        # The queue resolves final dev once; direct dispatch also requires an exact commit.
        shell: bash
        env:
          SELECTED_REF: ${{ inputs.ref }}
        run: |
          [[ "$SELECTED_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SELECTED_REF" ]]

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: Check supported host and closed inputs
        run: pnpm run doctor

      - name: Restore optional verified Electron download cache
        id: electron-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/bootstrap/electron
          key: ai7-electron-v1-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('config/dependency-artifacts.json') }}

      - name: Restore exact declared inputs
        run: pnpm run bootstrap

      - name: Save verified Electron download for this occurrence
        if: ${{ steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/bootstrap/electron
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Build the production-shaped subject
        run: pnpm run build

      - name: Run every admitted Journey
        run: pnpm run e2e:all

  result:
    name: Publish E2E Functional Gate result
    needs: [resolve, full]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.pr != '' && needs.resolve.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - name: Check out dispatched control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          check-latest: false
      - name: Publish the actual same-run full Journey result for the current candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.ref }}
          BASE_SHA: ${{ inputs.base }}
          FULL_GATE_CONTROL_SHA: ${{ github.workflow_sha }}
        run: >-
          node tools/nightly-queue.mjs full-gate-status
          --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          --head "$HEAD_SHA" --expected-dev-tip "$BASE_SHA"
