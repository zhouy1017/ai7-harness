<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI7 编辑工作台</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./renderer.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">AI7 · 本地编辑工作台</p>
        <h1>把来源变成可工作的稿件</h1>
      </div>
      <nav class="app-destinations" aria-label="全局">
        <button type="button" id="global-attention-entry" class="global-attention-entry">待我处理</button>
      </nav>
      <p class="locality" aria-label="处理方式：本地处理，未联网"><span aria-hidden="true">●</span> 本地处理 · 未联网</p>
    </header>
    <main id="screen" class="screen" aria-live="off"></main>
    <aside id="task-drawer" hidden></aside>
    <div id="persistence-status" class="status-bar" role="status" aria-live="polite">准备就绪</div>
  </body>
</html>
