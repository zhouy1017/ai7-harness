  <section epub:type="chapter" id="c2">
    <h1 id="c2h">第二章</h1>
    <p>清晨，海面平静。她把<em>昨夜</em>的记录抄在本子上。</p>
    <div class="illustration">
      <svg:svg version="1.1" viewBox="0 0 100 100" width="100%"><svg:image width="100" height="100" xlink:href="../images/figure-2.svg"/></svg:svg>
    </div>
    <blockquote><p>“灯不灭，船就不会迷路。”</p></blockquote>
    <p>她读完这句话，把本子放回抽屉。</p>
    <aside epub:type="footnote" id="n2"><p>这是第二章里的一条旁注。</p></aside>
