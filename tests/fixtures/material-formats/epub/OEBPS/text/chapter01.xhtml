    <h1 id="c1h">第一章</h1>
    <h2 id="c1s1">一、起风</h2>
    <p class="first">夜里<span class="calibre1">风</span>从海面上<i>慢慢</i>地吹过来，<a href="notes.xhtml#n1" epub:type="noteref" id="r1"><sup>[1]</sup></a>灯塔的窗口亮着。</p>
    <p>守灯人合上书，说：&ldquo;明天要涨潮。&rdquo;</p>
    <figure id="fig-1">
      <img src="../images/figure-1.png" alt="灯塔示意图（文件不在包内）"/>
      <figcaption>图一　灯塔的外形</figcaption>
    </figure>
    <h3 id="c1s1a">灯塔的第一盏灯</h3>
    <p>第一盏灯是在春天点起来的。<br/>它很小，却一直没有熄过。</p>
    <p><span><span><span><span><span>层层嵌套的行内元素</span></span></span></span></span>里的字也被读到。</p>
    <ul>
      <li>准备油和灯芯</li>
      <li>擦亮玻璃<ul><li>先擦里面</li><li>再擦外面</li></ul></li>
    </ul>
    <table>
      <thead><tr><th>时辰</th><th>潮位</th></tr></thead>
      <tbody><tr><td>清晨</td><td>低</td></tr><tr><td>黄昏</td><td>高</td></tr></tbody>
    </table>
